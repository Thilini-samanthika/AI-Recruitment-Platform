server:
  port: 8082

spring:
  application:
    name: candidate-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27018}/candidate_db}
      auto-index-creation: true

# Security & API Key
security:
  api-key: ${CANDIDATE_SERVICE_KEY:candidate-service-secret-key-12345}

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.recruitment.candidate: DEBUG
    org.springframework.security: INFO
