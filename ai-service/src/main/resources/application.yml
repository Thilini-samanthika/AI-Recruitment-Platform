server:
  port: 8085

spring:
  application:
    name: ai-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27021}/ai_db}
      auto-index-creation: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB

# Security & API Key Validation
security:
  api-key: ${AI_SERVICE_KEY:ai-service-secret-key-12345}

# File Upload Storage Configuration
storage:
  upload-dir: ${UPLOAD_DIR:uploads/resumes}

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.recruitment.ai: DEBUG
    org.springframework.security: INFO
