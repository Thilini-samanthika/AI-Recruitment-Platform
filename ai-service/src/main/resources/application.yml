server:
  port: 8085

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB

# Security & API Key Validation
security:
  api-key: ${AI_SERVICE_KEY:ai-service-secret-key-12345}

# File Upload Storage Configuration
storage:
  upload-dir: ${UPLOAD_DIR:uploads/resumes}

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.recruitment.ai: DEBUG
    org.springframework.security: INFO
