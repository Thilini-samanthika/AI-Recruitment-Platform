server:
  port: 8084

spring:
  application:
    name: job-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27020}/job_db}
      auto-index-creation: true

# Security & Internal API Key
security:
  api-key: ${JOB_SERVICE_KEY:job-service-secret-key-12345}

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.recruitment.job: DEBUG
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
