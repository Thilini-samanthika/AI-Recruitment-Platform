server:
  port: 8083

spring:
  application:
    name: company-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27019}/company_db}
      auto-index-creation: true

# Security & Internal API Key
security:
  api-key: ${COMPANY_SERVICE_KEY:company-service-secret-key-12345}

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.recruitment.company: DEBUG
    org.springframework.security: INFO
