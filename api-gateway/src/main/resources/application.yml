server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        # Auth Service Route
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        # Candidate Service Route
        - id: candidate-service
          uri: ${CANDIDATE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/candidates/**

        # Company Service Route
        - id: company-service
          uri: ${COMPANY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/companies/**

        # Job Service Route
        - id: job-service
          uri: ${JOB_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/jobs/**

        # AI Resume Service Route
        - id: ai-resume-service
          uri: ${AI_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/resume/**, /api/match/**, /api/recommendations/**, /api/ai/**

# JWT Secret Configuration for Gateway Validation
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Internal Service API Keys
security:
  internal-api-keys:
    - ${CANDIDATE_SERVICE_KEY:cand_sec_key_default}
    - ${COMPANY_SERVICE_KEY:comp_sec_key_default}
    - ${JOB_SERVICE_KEY:job_sec_key_default}
    - ${AI_SERVICE_KEY:ai_sec_key_default}

# CORS Configuration
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allowed-headers:
    - "*"
  allow-credentials: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.recruitment.gateway: DEBUG
