server:
  port: 8081

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${DB_HOST:localhost}:${DB_PORT:27017}/auth_db}
      auto-index-creation: true

# JWT Configuration
jwt:
  # Secret key (HMAC SHA-256 base64 encoded minimum 256 bits)
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # Expiration: 24 hours in milliseconds (86,400,000 ms)
  expiration: 86400000

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.recruitment.auth: DEBUG
    org.springframework.security: INFO
