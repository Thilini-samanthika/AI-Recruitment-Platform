services:
  # =========================================================================
  # 1. DATABASE LAYER (MongoDB 7.0 - Database-per-Service Pattern)
  # =========================================================================

  # Auth Service Database (Member 1)
  auth-db:
    image: mongo:7.0
    container_name: auth-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - auth_mongo_data:/data/db
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Candidate Service Database (Member 2)
  candidate-db:
    image: mongo:7.0
    container_name: candidate-db
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - candidate_mongo_data:/data/db
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Company Service Database (Member 3)
  company-db:
    image: mongo:7.0
    container_name: company-db
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - company_mongo_data:/data/db
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Job Service Database (Member 4)
  job-db:
    image: mongo:7.0
    container_name: job-db
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - job_mongo_data:/data/db
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Resume Service Database (Member 5)
  ai-db:
    image: mongo:7.0
    container_name: ai-db
    restart: unless-stopped
    ports:
      - "27021:27017"
    volumes:
      - ai_mongo_data:/data/db
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Rate Limiter Store (Member 1)
  gateway-redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. CORE BACKEND SERVICES (Member 1)
  # =========================================================================

  # Auth Service (Member 1)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://auth-db:27017/auth_db
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - recruitment-network

  # API Gateway (Member 1)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CANDIDATE_SERVICE_URL=http://candidate-service:8082
      - COMPANY_SERVICE_URL=http://company-service:8083
      - JOB_SERVICE_URL=http://job-service:8084
      - AI_SERVICE_URL=http://ai-service:8085
      - SPRING_DATA_REDIS_HOST=gateway-redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      auth-service:
        condition: service_started
      gateway-redis:
        condition: service_healthy
    networks:
      - recruitment-network

  # =========================================================================
  # 3. DOWNSTREAM MICROSERVICES (Members 2, 3, 4, 5)
  # =========================================================================

  # Candidate Service (Member 2)
  candidate-service:
    build:
      context: ./candidate-service
      dockerfile: Dockerfile
    container_name: candidate-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://candidate-db:27017/candidate_db
    depends_on:
      candidate-db:
        condition: service_healthy
    networks:
      - recruitment-network
    profiles: ["services", "all"]

  # Company Service (Member 3)
  company-service:
    build:
      context: ./company-service
      dockerfile: Dockerfile
    container_name: company-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://company-db:27017/company_db
    depends_on:
      company-db:
        condition: service_healthy
    networks:
      - recruitment-network
    profiles: ["services", "all"]

  # Job Service (Member 4)
  job-service:
    build:
      context: ./job-service
      dockerfile: Dockerfile
    container_name: job-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://job-db:27017/job_db
    depends_on:
      job-db:
        condition: service_healthy
    networks:
      - recruitment-network
    profiles: ["services", "all"]

  # AI Resume Service (Member 5)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://ai-db:27017/ai_db
      - AI_SERVICE_KEY=ai-service-secret-key-12345
    depends_on:
      ai-db:
        condition: service_healthy
    networks:
      - recruitment-network
    profiles: ["services", "all"]

  # Frontend UI (Member 5)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - REACT_APP_API_URL=http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - recruitment-network
    profiles: ["frontend", "all"]

# =========================================================================
# NETWORKS & VOLUMES
# =========================================================================
networks:
  recruitment-network:
    driver: bridge

volumes:
  auth_mongo_data:
    driver: local
  candidate_mongo_data:
    driver: local
  company_mongo_data:
    driver: local
  job_mongo_data:
    driver: local
  ai_mongo_data:
    driver: local
